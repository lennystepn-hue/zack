# Native builds on each OS: the Windows installer (NSIS) and the AppImage need
# x86 tools that an Apple Silicon Mac without Rosetta can't run.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg
          - os: windows-latest
            target: --win nsis portable --x64
          - os: ubuntu-latest
            target: --linux AppImage tar.gz --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --publish never ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: zack-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.tar.gz
          if-no-files-found: error
